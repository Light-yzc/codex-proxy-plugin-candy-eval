[package]
name = "codex-proxy-plugin-candy-eval"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
publish = false
autotests = false
rust-version = "1.99.1"

[[test]]
name = "candy_eval"
path = "tests/main.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "72215fe62a62d794a24a8d02f2d1951ce3810e5a", features = ["io"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }
uuid = { version = "1.17.0", features = ["v4", "v7"] }

[dev-dependencies]
jsonschema = "0.29"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "rt", "test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 8 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
